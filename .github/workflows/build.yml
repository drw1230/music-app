name: Build APK

# 触发：推送到 master/main 或手动运行（Actions 页面点 Run workflow）
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# 自动发 Release 需要写权限（默认 token 权限收紧时会失败）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不再使用 android-actions/setup-android：GitHub 托管的 ubuntu-latest 镜像已预装
      # 完整 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk，含 platforms;android-35
      # 与 build-tools;35.0.0/35.0.1，JDK 17 亦为镜像默认）。
      # 该 action 于 2026-09-15 起因 runner 把 node20 action 强制升到 node24 而失败（v3），
      # 升到 v4.0.1 后仍在同一步失败，故直接移除，改为打印 SDK 现状以便排障。
      - name: Verify Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo -n "platforms:   "; ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' '; echo
          echo -n "build-tools: "; ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' '; echo
          echo -n "sdkmanager:  "; command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null || true; echo
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "!! android-35 未预装，下一步会尝试安装"
          fi

      # Gradle 依赖缓存：第二次及以后构建跳过依赖下载（7 分钟 → 3-4 分钟）
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure SDK 35 platform (if needed)
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "android-35 已预装，跳过"
            exit 0
          fi
          SDK=$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SDK" ]; then
            echo "!! android-35 缺失且找不到 sdkmanager"
            exit 1
          fi
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 联网排行榜密钥（腾讯云 COS）：从仓库 Actions secrets 注入，不进代码仓库
      # 未设置 secrets 时生成空值文件 → APK 其他功能正常，仅排行榜上传提示"未配置"
      - name: Inject COS credentials
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          printf 'COS_SECRET_ID=%s\nCOS_SECRET_KEY=%s\n' "$COS_SECRET_ID" "$COS_SECRET_KEY" > secrets.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # ===== 自动发 Release（App 内「软件升级 → GitHub Releases」就是读这里）=====
      # 标签取 build.gradle.kts 的 versionName（如 v1.0.5）；同一版本重复构建 = 覆盖同一 Release
      - name: Read versionName
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$V" ]; then echo "!! 未能从 app/build.gradle.kts 读到 versionName"; exit 1; fi
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "读到版本: v$V"

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "DDmusic-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DDmusic ${{ steps.ver.outputs.tag }}
          body: |
            自动构建产物（debug 签名，可直接覆盖安装，不丢数据）

            - commit: ${{ github.sha }}
            - 下载下方 `DDmusic-${{ steps.ver.outputs.tag }}.apk` 后直接安装
          files: DDmusic-${{ steps.ver.outputs.tag }}.apk
          make_latest: true
