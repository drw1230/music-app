name: Build APK

# 触发：推送到 master/main 或手动运行（Actions 页面点 Run workflow）
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35 platform (if needed)
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      # 恢复本机 debug keystore（保证签名一致，可覆盖安装不丢数据）
      - name: Restore debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p $HOME/.android
          echo "$KEYSTORE_B64" | base64 -d > $HOME/.android/debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
