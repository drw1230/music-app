name: Build APK

# 触发：推送到 master/main 或手动运行（Actions 页面点 Run workflow）
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# 自动发 Release 需要写权限（默认 token 权限收紧时会失败）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 必须用 v4：GitHub 自 2026-09 起把 node20 老 action 强制升到 node24 运行，
      # android-actions/setup-android@v3 在 node24 下会直接报错（步骤 "Set up Android SDK" 失败，
      # 后续步骤全部 skipped）。v4 是补上 node24 兼容的大版本。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      # Gradle 依赖缓存：第二次及以后构建跳过依赖下载（7 分钟 → 3-4 分钟）
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install SDK 35 platform (if needed)
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 联网排行榜密钥（腾讯云 COS）：从仓库 Actions secrets 注入，不进代码仓库
      # 未设置 secrets 时生成空值文件 → APK 其他功能正常，仅排行榜上传提示"未配置"
      - name: Inject COS credentials
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          printf 'COS_SECRET_ID=%s\nCOS_SECRET_KEY=%s\n' "$COS_SECRET_ID" "$COS_SECRET_KEY" > secrets.properties

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # ===== 自动发 Release（App 内「软件升级 → GitHub Releases」就是读这里）=====
      # 标签取 build.gradle.kts 的 versionName（如 v1.0.5）；同一版本重复构建 = 覆盖同一 Release
      - name: Read versionName
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ -z "$V" ]; then echo "!! 未能从 app/build.gradle.kts 读到 versionName"; exit 1; fi
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "读到版本: v$V"

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "DDmusic-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DDmusic ${{ steps.ver.outputs.tag }}
          body: |
            自动构建产物（debug 签名，可直接覆盖安装，不丢数据）

            - commit: ${{ github.sha }}
            - 下载下方 `DDmusic-${{ steps.ver.outputs.tag }}.apk` 后直接安装
          files: DDmusic-${{ steps.ver.outputs.tag }}.apk
          make_latest: true
